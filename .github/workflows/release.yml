name: 릴리스

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: 클라이언트 빌드
        run: npm run build

      - name: 게임 패키지 생성 (game.zip)
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # dist 는 정확히 한 번만, 중첩되지 않게 복사한다
          New-Item -ItemType Directory -Force -Path "$stage\client" | Out-Null
          Copy-Item "client\dist" -Destination "$stage\client\dist" -Recurse -Force
          Copy-Item server $stage\server -Recurse -Force
          Copy-Item package.json $stage -Force
          Copy-Item app.js $stage -Force -ErrorAction SilentlyContinue
          Copy-Item 게임앱.vbs $stage -Force -ErrorAction SilentlyContinue
          Copy-Item 게임앱실행.cmd $stage -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage\*" -DestinationPath game.zip -Force
          Write-Host "game.zip: $([Math]::Round((Get-Item game.zip).Length/1KB,1))KB"

      - name: 런처 패키지 생성
        shell: pwsh
        run: |
          $l = "launcher-pack"
          New-Item -ItemType Directory -Force -Path $l | Out-Null
          Copy-Item launcher\* $l -Recurse -Force
          # game.zip 을 함께 넣어 오프라인에서도 설치되게 한다(런처는 먼저 서버에서 최신을 시도한다)
          Copy-Item game.zip $l -Force
          Compress-Archive -Path "$l\*" -DestinationPath YoseGuardian-launcher.zip -Force
          Write-Host "launcher: $([Math]::Round((Get-Item YoseGuardian-launcher.zip).Length/1KB,1))KB"

      - name: 단일 파일 설치기 생성 (게임 내장)
        shell: pwsh
        run: |
          node tools/build-single.mjs
          # 릴리스 자산은 ASCII 이름이어야 깨지지 않는다 (한글 이름은 _ 로 바뀐다)
          Copy-Item "요세의수호자_설치.exe" "YoseGuardian-Setup.exe" -Force
          Write-Host "single: $([Math]::Round((Get-Item YoseGuardian-Setup.exe).Length/1KB,1))KB"

      - name: 다운로드 런처 생성 (최신 게임 내려받기)
        shell: pwsh
        run: |
          node tools/build-launcher.mjs
          Write-Host "launcher: $([Math]::Round((Get-Item YoseGuardian-Launcher.exe).Length/1KB,1))KB"

      - name: 다운로더 앱 생성 (최신 게임 내려받기 · 새 앱)
        shell: pwsh
        run: |
          npm run downloader
          Write-Host "downloader: $([Math]::Round((Get-Item YoseGuardian-Downloader.exe).Length/1KB,1))KB"

      - name: 릴리스 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 요세의 수호자 ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            YoseGuardian-Setup.exe
            YoseGuardian-Launcher.exe
            YoseGuardian-Downloader.exe
            YoseGuardian-launcher.zip
            game.zip
          body: |
            ## 요세의 수호자

            ### 게임 다운로드 — 런처 exe (권장)

            **[YoseGuardian-Launcher.exe](https://github.com/parkjg0284-cloud/yose-guardian/releases/latest/download/YoseGuardian-Launcher.exe)** 하나만 받으면 됩니다 (약 671KB).

            1. 내려받기 → **더블클릭**
            2. 창에서 **[게임 다운로드 & 설치]** 한 번
            3. 설치가 끝나면 활성화되는 **[게임 시작]** 을 누릅니다

            | 상태 | 버튼 |
            | --- | --- |
            | 설치 전 | **게임 다운로드 & 설치** |
            | 새 버전이 있을 때 | **업데이트 (v1.7.0 → v1.8.0)** · [게임 시작] 잠김 |
            | 설치/업데이트 중 | **[게임 시작] 잠김** (`설치/업데이트 중…`) |
            | 이미 최신 | 버튼이 사라지고 **[게임 시작]** 활성화 |

            - 인터넷이 없으면 파일 안에 든 게임으로 설치됩니다.
            - 설치 폴더를 지우면 **[게임 다운로드 & 설치]** 버튼이 다시 나타납니다.
            - **[설치 파일 선택]** 으로 내려받아 둔 game.zip 을 골라 설치할 수도 있습니다.
            - 설치·업데이트 후 게임을 자동 실행하지 않습니다. **[게임 시작]** 을 눌러 주세요.

            ### v1.18.0 변경 내용

            - 메인화면(싱글·멀티)의 **[불러오기] 버튼 제거** — 세이브는 게임 안 **설정 → 내 세이브 목록**에서 불러옵니다.
            - 런처는 설치/업데이트가 필요한 동안 **[게임 시작]을 잠그고**, 끝나면 자동으로 활성화합니다.
            - 설치 후 자동 실행을 없애고, 불러오기 오류 처리(클라우드·복원)를 보강했습니다.
            - 오프라인 런처가 설치 버전을 잘못 판정하던 문제를 고쳤습니다.

            ### 다른 파일

            | 파일 | 설명 |
            | --- | --- |
            | **YoseGuardian-Launcher.exe** | **권장** — 게임 다운로드 런처 (다운로드 · 설치 · 시작) |
            | YoseGuardian-Setup.exe | 설치 프로그램 (게임 내장, 인터넷 없이 설치) |
            | YoseGuardian-Downloader.exe | 다운로더 앱 (같은 설치 흐름) |
            | YoseGuardian-launcher.zip | 런처 압축본 (풀어서 `설치실행.cmd`) |
            | game.zip | 게임 본체 (서버·수동 설치용) |

            ### 직접 실행 (개발자)
            ```bash
            npm install && npm run build && npm start
            ```
