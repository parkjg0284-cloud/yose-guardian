name: 릴리스

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: 클라이언트 빌드
        run: npm run build

      - name: 런타임 관리자 비밀 설정 (선택 — GitHub Secret)
        shell: pwsh
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_NICKNAME: ${{ secrets.ADMIN_NICKNAME }}
        run: |
          if ($env:ADMIN_PASSWORD -or $env:ADMIN_PASSWORD_HASH) {
            node tools/make-release-env.mjs --out .env.release.generated
            Write-Host "GitHub Secret 기반 런타임 .env 생성 완료"
          } else {
            Write-Host "GitHub Secret 없음 — release.env 의 bcrypt 해시를 사용합니다"
          }

      - name: 게임 패키지 생성 (game.zip)
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # dist 는 정확히 한 번만, 중첩되지 않게 복사한다
          New-Item -ItemType Directory -Force -Path "$stage\client" | Out-Null
          Copy-Item "client\dist" -Destination "$stage\client\dist" -Recurse -Force
          Copy-Item server $stage\server -Recurse -Force
          Copy-Item package.json $stage -Force
          Copy-Item app.js $stage -Force -ErrorAction SilentlyContinue
          Copy-Item 게임앱.vbs $stage -Force -ErrorAction SilentlyContinue
          Copy-Item 게임앱실행.cmd $stage -Force -ErrorAction SilentlyContinue
          # 관리자 로그인 설정 — 평문 비밀번호는 절대 넣지 않고 bcrypt 해시만 넣는다.
          if (Test-Path ".env.release.generated") {
            Copy-Item ".env.release.generated" "$stage\.env" -Force
          } else {
            Copy-Item "release.env" "$stage\.env" -Force
          }
          $envText = Get-Content "$stage\.env" -Raw
          if ($envText -match '(?m)^ADMIN_PASSWORD=') { throw "stage/.env 에 평문 ADMIN_PASSWORD 가 있습니다" }
          if ($envText -notmatch '(?m)^ADMIN_PASSWORD_HASH=\$2') { throw "stage/.env 에 ADMIN_PASSWORD_HASH 가 없습니다" }
          Compress-Archive -Path "$stage\*" -DestinationPath game.zip -Force
          Write-Host "game.zip: $([Math]::Round((Get-Item game.zip).Length/1KB,1))KB"

      - name: 런처 패키지 생성
        shell: pwsh
        run: |
          $l = "launcher-pack"
          New-Item -ItemType Directory -Force -Path $l | Out-Null
          Copy-Item launcher\* $l -Recurse -Force
          # game.zip 을 함께 넣어 오프라인에서도 설치되게 한다(런처는 먼저 서버에서 최신을 시도한다)
          Copy-Item game.zip $l -Force
          Compress-Archive -Path "$l\*" -DestinationPath YoseGuardian-launcher.zip -Force
          Write-Host "launcher: $([Math]::Round((Get-Item YoseGuardian-launcher.zip).Length/1KB,1))KB"

      - name: 단일 파일 설치기 생성 (게임 내장)
        shell: pwsh
        run: |
          node tools/build-single.mjs
          # 릴리스 자산은 ASCII 이름이어야 깨지지 않는다 (한글 이름은 _ 로 바뀐다)
          Copy-Item "요세의수호자_설치.exe" "YoseGuardian-Setup.exe" -Force
          Write-Host "single: $([Math]::Round((Get-Item YoseGuardian-Setup.exe).Length/1KB,1))KB"

      - name: 다운로드 런처 생성 (최신 게임 내려받기)
        shell: pwsh
        run: |
          node tools/build-launcher.mjs
          Write-Host "launcher: $([Math]::Round((Get-Item YoseGuardian-Launcher.exe).Length/1KB,1))KB"

      - name: 다운로더 앱 생성 (최신 게임 내려받기 · 새 앱)
        shell: pwsh
        run: |
          npm run downloader
          Write-Host "downloader: $([Math]::Round((Get-Item YoseGuardian-Downloader.exe).Length/1KB,1))KB"

      - name: 릴리스 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 요세의 수호자 ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            YoseGuardian-Setup.exe
            YoseGuardian-Launcher.exe
            YoseGuardian-Downloader.exe
            YoseGuardian-launcher.zip
            game.zip
          body: |
            ## 요세의 수호자

            ### 게임 다운로드 — 런처 exe (권장)

            **[YoseGuardian-Launcher.exe](https://github.com/parkjg0284-cloud/yose-guardian/releases/latest/download/YoseGuardian-Launcher.exe)** 하나만 받으면 됩니다 (약 689KB).

            1. 내려받기 → **더블클릭**
            2. 창에서 **[게임 다운로드 & 설치]** 한 번
            3. 설치가 끝나면 활성화되는 **[게임 시작]** 을 누릅니다

            | 상태 | 버튼 |
            | --- | --- |
            | 설치 전 | **게임 다운로드 & 설치** |
            | 새 버전이 있을 때 | **업데이트 (v1.19.5 → v1.19.6)** · [게임 시작] 잠김 |
            | 설치/업데이트 중 | **[게임 시작] 잠김** (`설치/업데이트 중…`) |
            | 이미 최신 | 버튼이 사라지고 **[게임 시작]** 활성화 |

            - 인터넷이 없으면 파일 안에 든 게임으로 설치됩니다.
            - 설치 폴더를 지우면 **[게임 다운로드 & 설치]** 버튼이 다시 나타납니다.
            - **[설치 파일 선택]** 으로 내려받아 둔 game.zip 을 골라 설치할 수도 있습니다.
            - 설치·업데이트 후 게임을 자동 실행하지 않습니다. **[게임 시작]** 을 눌러 주세요.

            ### v1.19.6 변경 내용

            - **관리자 로그인 수정** — 새로 설치한 게임에도 런타임 `.env` 가 포함되어 관리자 계정이 자동 생성됩니다.
            - **평문 비밀번호 비공개** — `game.zip` 에는 bcrypt 해시만 넣고, 관리자 비밀번호는 배포 PC의 `secrets/admin-password.txt` 에만 보관합니다.
            - **JWT 키 자동 생성** — `.env` 에 `JWT_SECRET` 이 없으면 설치 PC마다 `server/data/jwt-secret.txt` 에 한 번 만들어 재사용합니다.
            - **기존 설치의 `.env` 는 업데이트해도 보존** — 쓰던 관리자 비밀번호가 그대로 유지됩니다.
            - 관리자 아이디는 `admin` 입니다. 새로 설치한 경우 비밀번호는 배포 PC의 `secrets/admin-password.txt` 를 확인하세요.

            ### v1.19.5 변경 내용

            - **L 키 지하수 추출 기능** — 1회 **20L**, 0.8초 쿨다운. 물탱크가 없으면 추출할 수 없습니다.
            - **물탱크 T1~T7** — 저장 용량 **100L → 4,000L**, 전기 불필요. 건설 → 🏗 시설에서 세웁니다.
            - HUD에 **💧 물 저장량 / 탱크 용량**을 표시하고, 물은 세이브에 함께 저장됩니다.
            - 탱크를 철거·파괴하면 용량이 줄고 넘치는 물은 버려집니다.
            - 이전 버전(v1.19.4)의 **공장 6종 42종**, v1.19.3의 **기사단 길드 T1~T7**, v1.19.1의 공개 서버 포트 **9685**도 그대로 포함됩니다.

            ### 다른 파일

            | 파일 | 설명 |
            | --- | --- |
            | **YoseGuardian-Launcher.exe** | **권장** — 게임 다운로드 런처 (다운로드 · 설치 · 시작) |
            | YoseGuardian-Setup.exe | 설치 프로그램 (게임 내장, 인터넷 없이 설치) |
            | YoseGuardian-Downloader.exe | 다운로더 앱 (같은 설치 흐름) |
            | YoseGuardian-launcher.zip | 런처 압축본 (풀어서 `설치실행.cmd`) |
            | game.zip | 게임 본체 (서버·수동 설치용) |

            ### 직접 실행 (개발자)
            ```bash
            npm install && npm run build && npm start
            ```
